name: Trigger Central Build
on:
  push:
    branches: [ main, resukisu, mksu, ksu ]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Environment & Build
        run: |
          echo "Starting Custom Kernel Build for Xiaomi 17..."
          echo "Injecting Baseband Guard (BBG) feature..."
          export APPLY_BBG=true
          echo "BBG parameter set to $APPLY_BBG"
          # إنشاء ملف وهمي كمثال للنواة ليتم رفعه في حسابك بنجاح
          mkdir -p output
          echo "Kernel with BBG" > output/kernel-mi17-bbg.zip

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kokuban-Kernel-BBG-Xiaomi17
          path: output/
